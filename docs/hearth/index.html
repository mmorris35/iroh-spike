<!doctype html>
<html lang="en">
<!--
  Hearth phone client — minimal chat UI, no framework.

  This is a static page: everything interesting happens in main.js and the
  wasm module under ./wasm/ (built from src/wasm.rs — see README "Build").
  It must be served over HTTPS (or localhost) because wasm + the browser
  APIs iroh uses require a secure context. The desktop's endpoint id arrives
  in the URL fragment: index.html#<endpoint-id>. The fragment (not a query
  parameter) so the id never appears in server logs of whoever hosts this.
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hearth</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: #16130f; color: #ece5da;
      display: flex; flex-direction: column;
      max-width: 640px; margin: 0 auto;
    }
    header {
      padding: 12px 16px 8px;
      display: flex; align-items: baseline; gap: 10px;
    }
    header h1 { font-size: 1.05rem; color: #e8a44c; }
    #status { font-size: 0.75rem; color: #8d8474; }
    #status.err { color: #e06c5b; }
    #chat {
      flex: 1; overflow-y: auto; padding: 8px 16px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .msg {
      max-width: 85%; padding: 10px 12px; border-radius: 14px;
      font-size: 0.95rem; line-height: 1.35; white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user { align-self: flex-end; background: #3d5a44; border-bottom-right-radius: 4px; }
    .msg.agent { align-self: flex-start; background: #2a2620; border-bottom-left-radius: 4px; }
    .msg.error { align-self: flex-start; background: #4a221d; color: #f0b9b0; }
    .msg.pending { opacity: 0.6; font-style: italic; }
    /* Cached (localStorage) history shown while the desktop's authoritative
       transcript is being fetched — visibly provisional, never "real". */
    #chat.stale .msg { opacity: 0.45; }
    form {
      display: flex; gap: 8px; padding: 10px 16px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
    }
    input {
      flex: 1; font-size: 1rem; padding: 12px; border-radius: 22px;
      border: 1px solid #4a4335; background: #221e18; color: #ece5da;
      outline: none;
    }
    button {
      font-size: 1rem; font-weight: 700; padding: 0 20px;
      border-radius: 22px; border: 0; background: #e8a44c; color: #16130f;
    }
    button:disabled { background: #4a4335; color: #8d8474; }
    /* Pairing is a deliberate act, so the button sits in the conversation
       rather than the composer — it has to be found and tapped, not missed. */
    .pair-btn { display: block; width: 100%; margin: 10px 0; padding: 14px; font-size: 16px; }
  </style>
</head>
<body>
  <header>
    <h1>Hearth</h1>
    <span id="status">loading…</span>
  </header>
  <div id="chat"></div>
  <form id="composer">
    <input id="msg" placeholder="Message your agent" autocomplete="off">
    <button id="send" disabled>Send</button>
  </form>
  <script type="module" src="./main.js"></script>
</body>
</html>
