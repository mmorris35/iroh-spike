<!doctype html>
<html lang="en">
<!--
  Hearth phone client — minimal chat UI, no framework.

  This is a static page: everything interesting happens in main.js, the service
  worker in sw.js, and the wasm module under ./wasm/ (built from src/wasm.rs —
  see README "Build"). It must be served over HTTPS (or localhost) because
  wasm, the browser APIs iroh uses, and service workers all require a secure
  context.

  The desktop's endpoint id arrives in the URL fragment:
  index.html#<endpoint-id>. The fragment (not a query parameter) so the id
  never appears in the logs of whoever hosts this. It is an ADDRESS and
  nothing more — safe to bookmark, cache and install. Authorization is a
  separate short code typed into the app (docs/DECISIONS.md #12).
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16130f">
  <title>Hearth</title>
  <!--
    A real manifest, so "Add to Home Screen" installs a PWA rather than a
    bookmark. Note what it deliberately does NOT declare: start_url. Omitting
    it means the installed app starts from the document URL it was installed
    from, fragment and all — which is how the desktop's address survives
    installation. Declaring start_url would drop the fragment and orphan the
    app from the desktop it was installed for. (main.js also persists the
    address to localStorage as a second line of defence.)
  -->
  <link rel="manifest" href="./manifest.webmanifest">
  <!-- Home Screen icons: iPhone (180), iPad Pro (167), every other iPad (152).
       The unsized one stays first as the fallback older iOS picks. -->
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="167x167" href="./apple-touch-icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="./apple-touch-icon-152.png">
  <link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: #16130f; color: #ece5da;
      display: flex; flex-direction: column;
      max-width: 640px; margin: 0 auto;
    }
    header {
      padding: 12px 16px 8px;
      display: flex; align-items: baseline; gap: 10px;
    }
    header h1 { font-size: 1.05rem; color: #e8a44c; }
    #status { font-size: 0.75rem; color: #8d8474; }
    #status.err { color: #e06c5b; }
    #switch {
      margin-left: auto; font-size: 0.8rem; font-weight: 600;
      padding: 4px 10px; border-radius: 12px;
      background: #2a2620; color: #ece5da;
      flex-shrink: 0; max-width: 45%; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
      /* The ellipsis needs overflow: hidden, which would clip the hit area
         below, so this one is tall for real: 11px more padding above and
         below, given back by the margins, and the pill drawn by ::before
         exactly where the background used to be. Same layout, 44 pt target. */
      padding-block: 15px; margin-block: -11px; background: none; z-index: 0;
    }
    #switch::before {
      content: ""; position: absolute; inset: 11px 0; z-index: -1;
      background: #2a2620; border-radius: 12px;
    }
    /* Which desktop this phone is talking to: a full-screen list that slides
       in from the left, like Telegram's chat list (Mike, 2026-10-12: the
       drop-down's print was too small). One row per desktop. */
    #desktops {
      position: fixed; inset: 0; z-index: 50; max-width: 640px; margin: 0 auto;
      background: #16130f; overflow-y: auto;
      display: flex; flex-direction: column;
      padding: max(10px, env(safe-area-inset-top)) 0 max(10px, env(safe-area-inset-bottom));
      animation: slide-in 0.2s ease-out;
    }
    #desktops[hidden] { display: none; }
    @keyframes slide-in { from { transform: translateX(-100%); } to { transform: none; } }
    .list-head { display: flex; align-items: center; gap: 12px; padding: 6px 16px 12px; }
    .list-head h2 { font-size: 1.35rem; flex: 1; }
    .list-head button { font-size: 1.3rem; padding: 4px 12px; background: transparent; color: #ece5da; }
    .agent-row {
      display: flex; align-items: center; gap: 14px; width: 100%;
      padding: 10px 16px; border-radius: 0; text-align: left;
      background: transparent; color: #ece5da;
    }
    .agent-row.current { background: #221e18; }
    .avatar {
      width: 56px; height: 56px; border-radius: 50%; flex-shrink: 0;
      display: grid; place-items: center;
      font-size: 1.5rem; font-weight: 600; color: #fff;
    }
    .agent-text { min-width: 0; flex: 1; border-bottom: 1px solid #2a2620; padding-bottom: 10px; }
    .agent-name { font-size: 1.15rem; font-weight: 600; }
    .agent-row.current .agent-name { color: #e8a44c; }
    .agent-preview {
      font-size: 0.95rem; font-weight: 400; color: #8d8474; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .menu-item {
      text-align: left; font-size: 1.05rem; font-weight: 500;
      padding: 14px 16px; border-radius: 0;
      background: transparent; color: #ece5da;
    }
    .menu-item.current { color: #e8a44c; }
    .menu-item.action { color: #8d8474; }
    /* The switcher's in-page dialog (main.js ask()). The global form rule is
       for the composer, so undo its flex row and safe-area padding here. */
    #desktops form.ask { display: block; padding: 16px; }
    .ask p { font-size: 0.9rem; line-height: 1.4; margin-bottom: 10px; }
    .ask input { width: 100%; margin-bottom: 10px; }
    .ask-row { display: flex; justify-content: flex-end; gap: 8px; }
    .ask-row button { padding: 8px 18px; }
    .ask-row .ask-cancel { background: transparent; color: #8d8474; }
    .ask-row .ask-alt { margin-right: auto; background: transparent; border: 1px solid #5a5244; color: #ece5da; }
    .scan {
      position: fixed; inset: 0; z-index: 100; background: #000;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    }
    .scan video { width: 100%; max-width: 520px; max-height: 65vh; object-fit: cover; border-radius: 12px; background: #111; }
    .scan p { color: #ece5da; text-align: center; font-size: 0.95rem; max-width: 520px; }
    .scan button { padding: 10px 28px; }
    /* Statements about the code the user is running ("updated", "out of
       date"). Deliberately outside the conversation: it is not something the
       agent said, and it must not scroll away. */
    #notice {
      margin: 0 16px 8px; padding: 10px 12px; border-radius: 10px;
      background: #3a2f16; color: #f0d9a8; font-size: 0.85rem; line-height: 1.4;
    }
    .notice-btn { font-size: 0.85rem; padding: 4px 12px; border-radius: 12px; }
    #chat {
      flex: 1; overflow-y: auto; padding: 8px 16px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .msg {
      max-width: 85%; padding: 10px 12px; border-radius: 14px;
      font-size: 0.95rem; line-height: 1.35; white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user { align-self: flex-end; background: #3d5a44; border-bottom-right-radius: 4px; }
    .msg.agent { align-self: flex-start; background: #2a2620; border-bottom-left-radius: 4px; }
    .msg.error { align-self: flex-start; background: #4a221d; color: #f0b9b0; }
    .msg.pending { opacity: 0.7; font-variant-numeric: tabular-nums; }
    .msg .file { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
    .msg .file button { padding: 4px 10px; background: #4a4335; color: #ece5da; }
    .msg .file-link { color: #e8c88a; }
    .msg .file-note { opacity: 0.8; font-size: 0.85rem; }
    .msg .file-preview { display: block; max-width: 100%; border-radius: 8px; flex-basis: 100%; }
    .dots { display: inline-flex; gap: 4px; margin-right: 8px; vertical-align: middle; }
    .dots i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: dot 1.2s infinite ease-in-out both; }
    .dots i:nth-child(2) { animation-delay: 0.15s; }
    .dots i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes dot { 0%, 80%, 100% { opacity: 0.25; transform: none; } 40% { opacity: 1; transform: translateY(-3px); } }
    @media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: 0.6; } }
    /* Cached (localStorage) history shown while the desktop's authoritative
       transcript is being fetched — visibly provisional, never "real". */
    #chat.stale .msg { opacity: 0.45; }
    form {
      display: flex; gap: 8px; padding: 10px 16px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
    }
    input {
      flex: 1; font-size: 1rem; padding: 12px; border-radius: 22px;
      border: 1px solid #4a4335; background: #221e18; color: #ece5da;
      outline: none;
    }
    /* The composer grows with what is typed, up to about eight lines, then
       scrolls. Enter is a newline; Send sends (main.js). Buttons keep the
       one-line height and sit at the bottom as it grows. */
    #composer { align-items: flex-end; }
    /* One line of text plus padding: 46px at the default text size, and
       taller, not clipped, when the text is bigger (docs/IPAD.md). */
    #composer button { height: max(46px, 1.25rem + 26px); }
    /* A composer with less than 20rem inside it (a 320pt Slide Over window,
       or very large text) gives the buttons' padding to the text box. Every
       iPhone has more than that at the default text size (the SE: 343px). */
    #composer { container: composer / inline-size; }
    @container composer (max-width: 20rem) {
      #send { padding: 0 10px; }
      #attach { padding: 0 4px; }
      #msg::placeholder { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    }
    #msg {
      flex: 1; font: inherit; font-size: 1rem; line-height: 1.25; padding: 12px;
      border-radius: 22px; border: 1px solid #4a4335; background: #221e18;
      color: #ece5da; outline: none; resize: none; box-sizing: border-box;
      height: max(46px, 1.25rem + 26px); max-height: 12.5rem; overflow-y: auto;
    }
    button {
      font-size: 1rem; font-weight: 700; padding: 0 20px;
      border-radius: 22px; border: 0; background: #e8a44c; color: #16130f;
    }
    button:disabled { background: #4a4335; color: #8d8474; }
    /* 44 pt touch targets (Apple HIG) without changing how anything looks: a
       button smaller than that gets an invisible hit area that is. Absolutely
       positioned, so it takes no space; a finger, a Pencil tip and a trackpad
       click all land on it the same way. */
    button { position: relative; }
    button::after {
      content: ""; position: absolute; inset: min(0px, 50% - 22px);
    }
    /* Attachments waiting to go with the next message. Removable until Send. */
    #attach { padding: 0 12px; font-size: 1.15rem; background: #2a2620; color: #ece5da; }
    #attach:disabled { background: #221e18; color: #8d8474; }
    #chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 16px 0; }
    #chips[hidden] { display: none; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
      padding: 4px 4px 4px 10px; border-radius: 14px; background: #2a2620;
      font-size: 0.85rem; color: #ece5da;
    }
    .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 14em; }
    .chip button { padding: 0 8px; font-size: 0.9rem; line-height: 1.6; background: #4a4335; color: #ece5da; }
    /* Pairing is a deliberate act, so the code entry sits in the conversation
       rather than the composer — it has to be found and used, not missed. */
    #pair-form { padding: 10px 0; width: 100%; }
    #pair-code {
      font-size: 1.4rem; letter-spacing: 0.12em; text-align: center;
      text-transform: uppercase; font-family: ui-monospace, SFMono-Regular, monospace;
    }
    .join-ask { margin-top: 8px; background: transparent; color: #e8a44c; border: 1px solid #4a4335; }
    .join-request { padding: 10px; margin: 8px 0; border: 1px solid #4a4335; border-radius: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .join-request div { width: 100%; }
    .confirm-request { padding: 10px; margin: 8px 0; border: 1px solid #e8a44c; border-radius: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
    .confirm-request div { width: 100%; word-break: break-word; }
    /* The household settings screen (super user only; main.js shows the
       button only when the desktop serves this device the view). Full width
       on a desktop browser, where Mike edits the tables; stacked on a phone. */
    #household-btn:not([hidden]) + #switch { margin-left: 0; }
    #household-btn { margin-left: auto; font-size: 0.8rem; font-weight: 600; padding: 4px 10px; border-radius: 12px; background: #2a2620; color: #ece5da; flex-shrink: 0; }
    #household-btn[hidden] { display: none; }
    #household {
      position: fixed; inset: 0; z-index: 40; background: #16130f; overflow-y: auto;
      padding: max(10px, env(safe-area-inset-top)) 0 max(16px, env(safe-area-inset-bottom));
    }
    #household[hidden] { display: none; }
    .hh-wrap { max-width: 640px; margin: 0 auto; }
    .hh-section { margin: 0 16px 28px; }
    .hh-section h3 { font-size: 1.05rem; color: #e8a44c; margin-bottom: 8px; }
    .hh-msg { margin: 0 16px 12px; padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; white-space: pre-wrap; background: #2a2620; }
    .hh-msg.err { background: #4a221d; color: #f0b9b0; }
    .hh-msg[hidden] { display: none; }
    .hh-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .hh-table th { text-align: left; font-weight: 600; color: #8d8474; padding: 6px 8px; border-bottom: 1px solid #4a4335; }
    .hh-table td { padding: 6px 8px; border-bottom: 1px solid #2a2620; vertical-align: top; }
    .hh-table code { font-size: 0.8rem; color: #8d8474; }
    #household input, #household select {
      font-size: 0.9rem; padding: 6px 8px; border-radius: 8px; flex: none;
      border: 1px solid #4a4335; background: #221e18; color: #ece5da; max-width: 100%;
    }
    #household input[type="checkbox"] { padding: 0; }
    #household button { font-size: 0.9rem; padding: 6px 14px; }
    #household button.quiet { background: transparent; border: 1px solid #5a5244; color: #ece5da; }
    .hh-tools { display: flex; flex-wrap: wrap; gap: 4px 12px; }
    .hh-tools label, .hh-inline { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .hh-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
    @media (max-width: 799px) {
      /* Phone: each row is a card, each cell labelled from its column. */
      .hh-table thead { display: none; }
      .hh-table tr { display: block; padding: 8px 0; border-bottom: 1px solid #4a4335; }
      .hh-table td { display: block; border: 0; padding: 4px 0; }
      .hh-table td[data-label]::before { content: attr(data-label); display: block; font-size: 0.75rem; color: #8d8474; }
      #household input:not([type="checkbox"]), #household select { width: 100%; }
      #household .hh-inline select { width: auto; }
    }
    @media (min-width: 800px) {
      .hh-wrap { max-width: 1400px; padding: 0 16px; }
      .hh-table td input:not([type="checkbox"]) { width: 100%; min-width: 6em; }
    }

    /* ---- iPad, and any other window this wide (docs/IPAD.md) -------------
       Laid out by the window's width, never by device: a Split View tile or a
       Stage Manager window gets whatever its width calls for, and a phone is
       never told it is one. Below 700px everything above applies untouched —
       that is the phone layout, and it is also what a narrow iPad window gets.
       The min-height keeps a phone on its side (at most 440pt tall) on the
       phone layout even when it is 900+ wide.

       700px and up: the page spans the window, and the conversation sits in a
       centred column of readable width (--column) rather than a 640px strip
       or a full-width sprawl. The composer and attachments share the column,
       so Send stays under the conversation instead of at the far edge. */
    @media (min-width: 700px) and (min-height: 500px) {
      body { max-width: none; --column: 48rem; }
      header {
        padding-top: max(12px, env(safe-area-inset-top));
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }
      #chat, #chips, #composer {
        padding-left: max(16px, env(safe-area-inset-left), (100% - var(--column)) / 2);
        padding-right: max(16px, env(safe-area-inset-right), (100% - var(--column)) / 2);
      }
      #notice {
        margin-left: max(16px, (100% - var(--column)) / 2);
        margin-right: max(16px, (100% - var(--column)) / 2);
      }
      /* The column is a container, so bubbles size to the column they are in
         (narrower once the desktop list is docked beside it), not the window. */
      #chat { container: chat / inline-size; }
      @container chat (min-width: 36rem) {
        .msg { max-width: min(82%, 40rem); line-height: 1.4; }
      }
      /* The desktop list opens as a drawer from the left edge instead of a
         640px sheet floating in the middle of the screen. */
      #desktops {
        max-width: min(400px, 100%); margin: 0;
        border-right: 1px solid #2a2620; box-shadow: 8px 0 24px rgb(0 0 0 / 0.45);
        padding-left: env(safe-area-inset-left);
      }
    }

    /* 960px and up: room for the desktop list beside the chat, so it stays
       docked there — the iPad's sidebar — and the header button that opens it
       on a phone is not needed. The chat keeps at least 620px. */
    @media (min-width: 960px) and (min-height: 500px) {
      body {
        display: grid;
        grid-template-columns: clamp(280px, 28vw, 360px) minmax(0, 1fr);
        grid-template-rows: auto auto minmax(0, 1fr) auto auto;
      }
      header { grid-area: 1 / 2; }
      #notice { grid-area: 2 / 2; }
      #chat { grid-area: 3 / 2; }
      #chips { grid-area: 4 / 2; }
      #composer { grid-area: 5 / 2; }
      #desktops {
        position: static; grid-area: 1 / 1 / -1 / 2; z-index: auto;
        max-width: none; animation: none; box-shadow: none;
      }
      #switch, #desktops .list-head button { display: none; }
    }

    /* A trackpad or mouse on iPad (or any pointer that hovers): show what is
       clickable. Touch-only screens never match, so a tap leaves no sticky
       highlight behind. */
    @media (any-hover: hover) {
      button:not(:disabled) { cursor: pointer; }
      button:not(:disabled):hover { filter: brightness(1.12); }
      .agent-row:hover, .menu-item:not(:disabled):hover { background: #2a2620; filter: none; }
    }
    /* Keyboard focus (iPad with a hardware keyboard and Full Keyboard Access). */
    button:focus-visible { outline: 2px solid #e8a44c; outline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <h1>Hearth</h1>
    <span id="status">loading…</span>
    <button id="household-btn" type="button" hidden>Household</button>
    <button id="switch" type="button">Desktops ▾</button>
  </header>
  <div id="desktops" hidden></div>
  <div id="household" hidden></div>
  <div id="notice" hidden></div>
  <div id="chat"></div>
  <div id="chips" hidden></div>
  <form id="composer">
    <button id="attach" type="button" aria-label="Attach files" title="Attach files" disabled>📎</button>
    <input id="file" type="file" multiple hidden>
    <textarea id="msg" rows="1" placeholder="Message your agent" autocomplete="off" enterkeyhint="enter"></textarea>
    <button id="send" disabled>Send</button>
  </form>
  <!--
    The ?v= is stamped by scripts/set-client-version.sh. The service worker is
    now the real update mechanism (network-first for this shell), but the very
    first visit to a browser happens before any worker is installed, and this
    keeps a plain HTTP cache from pairing a new index.html with an old main.js.
  -->
  <script type="module" src="./main.js?v=0.4.7"></script>
</body>
</html>
